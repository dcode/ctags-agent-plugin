[project]
name = "ctags-agent-plugin"
version = "0.1.0"
description = "Universal / Exuberant Ctags symbol tools (search_symbols, list_symbols, generate_ctags) as an agent-agnostic MCP server and Agent Plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[dependency-groups]
dev = [
    "check-jsonschema>=0.31.0",
    "jsonschema>=4.23.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["server", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF",
]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=server --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
