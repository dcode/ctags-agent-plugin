repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  # Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Schema validation for Agent Plugins spec
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.31.0
    hooks:
      - id: check-jsonschema
        name: validate plugin.json
        files: ^plugin\.json$
        args: ["--schemafile", "schemas/1.0.0/plugin.schema.json"]
      - id: check-jsonschema
        name: validate mcp.json
        files: ^mcp\.json$
        args: ["--schemafile", "schemas/1.0.0/mcp.schema.json"]

  # Full Agent Plugins specification compliance check
  - repo: local
    hooks:
      - id: validate-agent-plugin-spec
        name: validate agent plugins specification
        entry: uv run python scripts/validate_spec.py .
        language: system
        pass_filenames: false
        always_run: true
